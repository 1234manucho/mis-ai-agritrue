<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logged Out</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .logout-container {
            background: #fff;
            padding: 2rem 3rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }
        .logout-container a {
            color: #2d7ff9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h2>You have been logged out.</h2>
        <p><a href="{% url 'login' %}">Log in again</a></p>
    </div>
</body>
</html>
