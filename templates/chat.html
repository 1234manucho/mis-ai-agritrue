<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTrue AI Chatbot</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Use Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Custom CSS animations and styles for the chatbot */
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #chatbot-container {
            animation: slide-up 0.4s ease-out;
        }
        .message.bot-message:hover .tts-btn { opacity: 1; pointer-events: auto; }
        .dot-pulse {
            position: relative;
            width: 10px; height: 10px; border-radius: 50%;
            background-color: #22c55e; color: #22c55e;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 1);
            animation: dot-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .dot-pulse::before, .dot-pulse::after {
            content: ''; position: absolute; width: 10px; height: 10px;
            border-radius: 50%; background-color: #22c55e;
            color: #22c55e; box-shadow: 0 0 0 0 rgba(34, 197, 94, 1);
        }
        .dot-pulse::before { left: -15px; animation: dot-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) -0.3s infinite; }
        .dot-pulse::after { left: 15px; animation: dot-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) -0.6s infinite; }
        @keyframes dot-pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.8); }
            100% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen overflow-hidden p-4">

    <!-- Main Chatbot Container (Initially hidden) -->
    <div id="chatbot-container" class="hidden fixed bottom-24 right-6 w-96 h-[500px] bg-white rounded-xl shadow-2xl flex flex-col overflow-hidden z-50">
        <!-- Chatbot Header -->
        <div id="chatbot-header" class="bg-gradient-to-r from-green-500 to-green-700 text-white p-4 font-bold flex justify-between items-center">
            <span id="header-text" class="text-xl flex items-center gap-2">
                <i class="fa-solid fa-seedling text-lg mr-2"></i> AgriTrue
            </span>
            <button id="close-chatbot" class="bg-transparent border-none text-white text-3xl cursor-pointer hover:opacity-80 transition-opacity">&times;</button>
        </div>

        <!-- Chat Messages Display Area -->
        <div id="chatbot-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
            <!-- Initial Bot Message -->
            <div class="message bot-message max-w-[80%] p-3 rounded-2xl leading-tight text-sm relative bg-green-500 text-white self-start rounded-bl-sm">
                Hello! I am AgriTrue AI. How can I help you today?
                <button class="tts-btn bg-white/20 text-white border-none p-1.5 rounded-full cursor-pointer absolute -bottom-1 -right-6 transition-all opacity-100 pointer-events-auto hover:bg-white/30">🔊</button>
            </div>
        </div>

        <!-- Input Section -->
        <div class="p-4 border-t border-gray-200">
            <div class="flex items-center gap-2 mb-4">
                <input id="user-input" type="text" placeholder="Type a message..." class="flex-1 px-4 py-3 border border-gray-300 rounded-full outline-none focus:ring-2 focus:ring-green-500 transition-shadow">
                <input type="file" id="image-input" accept="image/*" class="hidden">
                <button id="image-upload-btn" title="Upload Image" class="bg-purple-600 text-white p-3 rounded-full border-none cursor-pointer transition-transform hover:scale-105">📸</button>
                <button id="voice-input-btn" title="Use Voice Input" class="bg-blue-500 text-white p-3 rounded-full border-none cursor-pointer transition-transform hover:scale-105">🎙️</button>
                <button id="fact-btn" title="Get a Farm Fact" class="bg-pink-300 text-white p-3 rounded-full border-none cursor-pointer transition-transform hover:scale-105"><i class="fa-solid fa-lightbulb"></i></button>
                <button id="advice-btn" title="Get Advice" class="bg-green-600 text-white p-3 rounded-full border-none cursor-pointer transition-transform hover:scale-105"><i class="fa-solid fa-stethoscope"></i></button>
                <button id="report-btn" title="Generate Report" class="bg-gray-800 text-white p-3 rounded-full border-none cursor-pointer transition-transform hover:scale-105"><i class="fa-solid fa-chart-line"></i></button>
                <button id="send-btn" title="Send Message" class="bg-green-700 text-white p-3 rounded-full border-none cursor-pointer transition-transform hover:scale-105"><i class="fa-solid fa-paper-plane"></i></button>
            </div>

            <!-- Image Preview -->
            <div id="image-preview-container" class="mt-2 hidden">
                <img id="image-preview" src="#" alt="Image Preview" class="max-h-24 rounded-lg shadow-md mb-2">
                <button id="remove-image-btn" class="text-red-500 bg-transparent border-none cursor-pointer text-sm">Remove Image</button>
            </div>

            <!-- Contact Buttons -->
            <div class="flex justify-center gap-6">
                <a href="https://wa.me/254715142906" target="_blank" title="WhatsApp" class="bg-green-500 text-white w-12 h-12 flex items-center justify-center rounded-full shadow-md transition-transform hover:scale-110 text-xl">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="tel:+254715142906" title="Call" class="bg-green-700 text-white w-12 h-12 flex items-center justify-center rounded-full shadow-md transition-transform hover:scale-110 text-xl">
                    <i class="fas fa-phone-alt"></i>
                </a>
                <a href="mailto:agritrue13@gmail.com" title="Email" class="bg-blue-500 text-white w-12 h-12 flex items-center justify-center rounded-full shadow-md transition-transform hover:scale-110 text-xl">
                    <i class="fas fa-envelope"></i>
                </a>
                <a href="sms:+254715142906" title="SMS" class="bg-orange-500 text-white w-12 h-12 flex items-center justify-center rounded-full shadow-md transition-transform hover:scale-110 text-xl">
                    <i class="fas fa-sms"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Chatbot Icon (Always visible) -->
    <button id="chatbot-icon" class="fixed bottom-6 right-6 bg-green-700 text-white rounded-full p-4 shadow-md cursor-pointer transition-transform hover:scale-110 z-40">
        <i class="fas fa-comment-dots text-2xl"></i>
    </button>

    <script>
        window.onload = function() {
            const chatbotIcon = document.getElementById("chatbot-icon");
            const chatbotContainer = document.getElementById("chatbot-container");
            const closeChatbotBtn = document.getElementById("close-chatbot");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const voiceInputBtn = document.getElementById("voice-input-btn");
            const factBtn = document.getElementById("fact-btn");
            const adviceBtn = document.getElementById("advice-btn");
            const reportBtn = document.getElementById("report-btn");
            const messagesContainer = document.getElementById("chatbot-messages");
            const headerText = document.getElementById("header-text");
            const originalHeaderText = headerText.innerHTML;

            const imageInput = document.getElementById("image-input");
            const imageUploadBtn = document.getElementById("image-upload-btn");
            const imagePreviewContainer = document.getElementById("image-preview-container");
            const imagePreview = document.getElementById("image-preview");
            const removeImageBtn = document.getElementById("remove-image-btn");
            let uploadedImageBase64 = null;

            // Helper functions for TTS
            function base64ToArrayBuffer(base64) {
                const binaryString = atob(base64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes.buffer;
            }
            function pcmToWav(pcm16, sampleRate) {
                const wavHeader = new ArrayBuffer(44);
                const view = new DataView(wavHeader);
                view.setUint32(0, 0x46464952, true); // "RIFF"
                view.setUint32(4, 36 + pcm16.length * 2, true);
                view.setUint32(8, 0x45564157, true); // "WAVE"
                view.setUint32(12, 0x20746d66, true); // "fmt "
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, 1, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                view.setUint32(36, 0x61746164, true); // "data"
                view.setUint32(40, pcm16.length * 2, true);
                const buffer = new Uint8Array(wavHeader.byteLength + pcm16.byteLength * 2);
                buffer.set(new Uint8Array(wavHeader), 0);
                buffer.set(new Uint8Array(pcm16.buffer), wavHeader.byteLength);
                return new Blob([buffer], { type: "audio/wav" });
            }
            async function speakMessage(text) {
                const audio = new Audio();
                audio.src = '#';
                const payload = {
                    contents: [{ parts: [{ text: text }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                    }
                };
                const apiKey = "AIzaSyAtHy3rOfV2aYRfi0Ywbt_RLQnQjN2dNrA";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                try {
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType;
                    if (audioData && mimeType && mimeType.startsWith("audio/")) {
                        const sampleRate = parseInt(mimeType.match(/rate=(\d+)/)[1], 10);
                        const pcmData = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmData);
                        const wavBlob = pcmToWav(pcm16, sampleRate);
                        const audioUrl = URL.createObjectURL(wavBlob);
                        audio.src = audioUrl;
                        audio.play();
                    } else {
                        console.error("TTS response is not a valid audio format.");
                    }
                } catch (error) {
                    console.error('Error with TTS:', error);
                }
            }

            // Function to append a new message to the chat
            function appendMessage(message, sender, imageBase64 = null) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'max-w-[80%] p-3 rounded-2xl leading-tight text-sm relative';
                
                if (sender === 'user') {
                    messageDiv.classList.add('bg-gray-200', 'text-gray-800', 'self-end', 'rounded-br-sm');
                } else {
                    messageDiv.classList.add('bg-green-500', 'text-white', 'self-start', 'rounded-bl-sm');
                }

                if (imageBase64) {
                    const img = document.createElement('img');
                    img.src = `data:image/jpeg;base64,${imageBase64}`;
                    img.className = 'max-w-full rounded-lg mb-2';
                    messageDiv.appendChild(img);
                }
                const textNode = document.createTextNode(message);
                messageDiv.appendChild(textNode);
                messagesContainer.appendChild(messageDiv);

                if (sender === 'bot') {
                    const ttsButton = document.createElement('button');
                    ttsButton.textContent = '🔊';
                    ttsButton.className = 'tts-btn bg-white/20 text-white border-none p-1.5 rounded-full cursor-pointer absolute -bottom-1 -right-6 transition-all opacity-100 pointer-events-auto hover:bg-white/30';
                    ttsButton.onclick = () => speakMessage(message);
                    messageDiv.appendChild(ttsButton);
                }
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            // Function to make API call for text generation with exponential backoff
            async function getGeminiTextResponse(prompt) {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };
                let retries = 0;
                const maxRetries = 3;
                while (retries < maxRetries) {
                    try {
                        const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        if (!response.ok) {
                            if (response.status === 429) {
                                retries++;
                                await new Promise(resolve => setTimeout(resolve, Math.pow(2, retries) * 1000));
                                continue;
                            }
                            throw new Error(`API call failed with status: ${response.status}`);
                        }
                        const result = await response.json();
                        const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                        return text || "I'm sorry, I couldn't generate a response at this time.";
                    } catch (error) {
                        console.error('Error calling Gemini API:', error);
                        retries++;
                        if (retries >= maxRetries) {
                            return "I'm sorry, I couldn't get a response. Please check your internet connection and try again later.";
                        }
                        await new Promise(resolve => setTimeout(resolve, Math.pow(2, retries) * 1000));
                    }
                }
                return "I'm sorry, I'm unable to connect right now. Please try again in a moment.";
            }

            // Function to make API call for image analysis with exponential backoff
            async function getGeminiImageResponse(prompt, imageBase64) {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{
                        role: "user",
                        parts: [ { text: prompt }, { inlineData: { mimeType: "image/jpeg", data: imageBase64 } } ]
                    }]
                };
                let retries = 0;
                const maxRetries = 3;
                while (retries < maxRetries) {
                    try {
                        const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        if (!response.ok) {
                            if (response.status === 429) {
                                retries++;
                                await new Promise(resolve => setTimeout(resolve, Math.pow(2, retries) * 1000));
                                continue;
                            }
                            throw new Error(`API call failed with status: ${response.status}`);
                        }
                        const result = await response.json();
                        const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                        return text || "I'm sorry, I couldn't generate a response for this image.";
                    } catch (error) {
                        console.error('Error calling Gemini API with image:', error);
                        retries++;
                        if (retries >= maxRetries) {
                            return "I'm sorry, I couldn't analyze the image. Please check your internet connection and try again later.";
                        }
                        await new Promise(resolve => setTimeout(resolve, Math.pow(2, retries) * 1000));
                    }
                }
                return "I'm sorry, I'm unable to process the image right now. Please try again in a moment.";
            }


            async function sendMessage() {
                const message = userInput.value.trim();
                const hasImage = uploadedImageBase64 !== null;
                if (message || hasImage) {
                    appendMessage(message, 'user', uploadedImageBase64);
                    userInput.value = '';
                    uploadedImageBase64 = null;
                    imagePreviewContainer.style.display = 'none';

                    const thinkingMessageDiv = document.createElement('div');
                    thinkingMessageDiv.innerHTML = '<span class="dot-pulse"></span>';
                    thinkingMessageDiv.className = 'message bot-message flex items-center gap-2';
                    messagesContainer.appendChild(thinkingMessageDiv);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;

                    let botResponse;
                    if (hasImage) {
                        const aiPrompt = `You are AgriTrue, an expert agricultural AI. Analyze the uploaded image to identify any plant diseases, pests, or nutritional deficiencies. Provide a clear diagnosis and suggest a specific course of action or treatment. If you cannot identify the issue, say so clearly.`;
                        botResponse = await getGeminiImageResponse(aiPrompt, uploadedImageBase64);
                    } else {
                        let aiPrompt = `You are AgriTrue, an expert agricultural AI. Respond to the user's query in a concise and helpful way, keeping your advice related to farming and crop management. User's query: ${message}`;
                        // Special handling for greetings
                        const lowerCaseMessage = message.toLowerCase();
                        if (lowerCaseMessage.includes('hello') || lowerCaseMessage.includes('hi')) {
                            aiPrompt = `The user said "${message}". Respond with a friendly greeting and ask how you can help them with their farming needs.`;
                        }
                        botResponse = await getGeminiTextResponse(aiPrompt);
                    }

                    messagesContainer.removeChild(thinkingMessageDiv);
                    appendMessage(botResponse, 'bot');
                }
            }

            // Function for the "Get Advice" feature
            async function getAdvice() {
                // Using a custom modal to replace the browser's native `prompt` and `alert`
                const problem = await new Promise(resolve => {
                    const modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50';
                    modal.innerHTML = `
                        <div class="bg-white p-6 rounded-lg shadow-xl w-80">
                            <p class="mb-4">What is your crop and what problem are you seeing?</p>
                            <input type="text" id="prompt-input" class="w-full p-2 border border-gray-300 rounded mb-4" placeholder="e.g., 'My tomato plant has yellow leaves.'">
                            <div class="flex justify-end gap-2">
                                <button id="cancel-btn" class="px-4 py-2 bg-gray-200 rounded">Cancel</button>
                                <button id="ok-btn" class="px-4 py-2 bg-green-500 text-white rounded">OK</button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(modal);
                    const input = document.getElementById('prompt-input');
                    const okBtn = document.getElementById('ok-btn');
                    const cancelBtn = document.getElementById('cancel-btn');

                    okBtn.onclick = () => {
                        document.body.removeChild(modal);
                        resolve(input.value);
                    };
                    cancelBtn.onclick = () => {
                        document.body.removeChild(modal);
                        resolve(null);
                    };
                    input.focus();
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') okBtn.click();
                    });
                });

                if (!problem) return;

                const thinkingMessageDiv = document.createElement('div');
                thinkingMessageDiv.innerHTML = '<span class="dot-pulse"></span>';
                thinkingMessageDiv.className = 'message bot-message';
                messagesContainer.appendChild(thinkingMessageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                const aiPrompt = `You are AgriTrue, an expert agricultural advisor. A farmer needs help with a crop problem. The problem is: "${problem}". Provide a detailed diagnosis and a step-by-step plan for treatment or resolution. Structure your response with clear headings like "Diagnosis" and "Recommended Action Plan."`;
                const botResponse = await getGeminiTextResponse(aiPrompt);

                messagesContainer.removeChild(thinkingMessageDiv);
                appendMessage(botResponse, 'bot');
            }

            // Function for the "Generate Report" feature
            async function generateReport() {
                const topic = await new Promise(resolve => {
                    const modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50';
                    modal.innerHTML = `
                        <div class="bg-white p-6 rounded-lg shadow-xl w-80">
                            <p class="mb-4">What is the topic for your agricultural report?</p>
                            <input type="text" id="prompt-input" class="w-full p-2 border border-gray-300 rounded mb-4" placeholder="e.g., 'sustainable farming practices'">
                            <div class="flex justify-end gap-2">
                                <button id="cancel-btn" class="px-4 py-2 bg-gray-200 rounded">Cancel</button>
                                <button id="ok-btn" class="px-4 py-2 bg-green-500 text-white rounded">OK</button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(modal);
                    const input = document.getElementById('prompt-input');
                    const okBtn = document.getElementById('ok-btn');
                    const cancelBtn = document.getElementById('cancel-btn');

                    okBtn.onclick = () => {
                        document.body.removeChild(modal);
                        resolve(input.value);
                    };
                    cancelBtn.onclick = () => {
                        document.body.removeChild(modal);
                        resolve(null);
                    };
                    input.focus();
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') okBtn.click();
                    });
                });

                if (!topic) return;

                const thinkingMessageDiv = document.createElement('div');
                thinkingMessageDiv.innerHTML = '<span class="dot-pulse"></span>';
                thinkingMessageDiv.className = 'message bot-message';
                messagesContainer.appendChild(thinkingMessageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                const aiPrompt = `You are AgriTrue, an agricultural analyst. Generate a short, well-structured report on the topic of "${topic}". The report should include an introduction, key findings, and a conclusion. Use markdown for headings and bullet points to make the report easy to read.`;
                const botResponse = await getGeminiTextResponse(aiPrompt);

                messagesContainer.removeChild(thinkingMessageDiv);
                appendMessage(botResponse, 'bot');
            }

            // Existing function to generate a farm fact
            async function generateFarmFact() {
                const thinkingMessageDiv = document.createElement('div');
                thinkingMessageDiv.innerHTML = '<span class="dot-pulse"></span>';
                thinkingMessageDiv.className = 'message bot-message flex items-center gap-2';
                messagesContainer.appendChild(thinkingMessageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                const factPrompt = "Generate a concise and interesting fact about farming, a practical agronomy tip, or a tip on pest management. The response should be a single, short paragraph.";
                const botResponse = await getGeminiTextResponse(factPrompt);

                messagesContainer.removeChild(thinkingMessageDiv);
                appendMessage(botResponse, 'bot');
            }

            // Voice input feature
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.lang = 'en-US';
                voiceInputBtn.addEventListener('click', () => {
                    try {
                        recognition.start();
                        voiceInputBtn.innerHTML = '●';
                        voiceInputBtn.classList.remove('bg-blue-500');
                        voiceInputBtn.classList.add('bg-gray-400');
                    } catch (e) { console.error('Speech recognition start error:', e); }
                });
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    userInput.value = transcript;
                    sendMessage();
                };
                recognition.onend = () => {
                    voiceInputBtn.innerHTML = '🎙️';
                    voiceInputBtn.classList.remove('bg-gray-400');
                    voiceInputBtn.classList.add('bg-blue-500');
                };
                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    appendMessage("Voice recognition error. Please try again or type your message.", 'bot');
                };
            } else {
                voiceInputBtn.style.display = 'none';
                console.warn("Speech Recognition API not supported in this browser.");
            }

            // Image upload functionality
            imageUploadBtn.addEventListener('click', () => { imageInput.click(); });
            imageInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        uploadedImageBase64 = reader.result.replace('data:image/jpeg;base64,', ''); // Remove the data URI prefix
                        imagePreview.src = reader.result;
                        imagePreviewContainer.classList.remove('hidden');
                        userInput.placeholder = "Image uploaded. You can type a message to go with it...";
                    };
                    reader.readAsDataURL(file);
                }
            });
            removeImageBtn.addEventListener('click', () => {
                uploadedImageBase64 = null;
                imagePreviewContainer.classList.add('hidden');
                userInput.placeholder = "Type a message...";
                imageInput.value = '';
            });

            // Chatbot visibility and event listeners
            chatbotIcon.onclick = () => {
                chatbotContainer.classList.remove('hidden');
                chatbotContainer.classList.add('flex');
                chatbotIcon.classList.add('hidden');
                headerText.innerHTML = `<i class="fa-solid fa-seedling text-lg mr-2"></i> AgriTrue`;
            };
            closeChatbotBtn.onclick = () => {
                chatbotContainer.classList.add('hidden');
                chatbotContainer.classList.remove('flex');
                chatbotIcon.classList.remove('hidden');
                headerText.innerHTML = originalHeaderText;
            };
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { sendMessage(); }
            });
            factBtn.addEventListener('click', generateFarmFact);
            adviceBtn.addEventListener('click', getAdvice);
            reportBtn.addEventListener('click', generateReport);
        };
    </script>
</body>
</html>
