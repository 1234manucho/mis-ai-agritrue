<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriTrue - My GreenGrow Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      background: linear-gradient(#e0f8e9, #ffffff);
      color: #2e4d2c;
      padding: 0;
    }
    .profile-container {
      max-width: 900px;
      margin: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(46, 77, 44, 0.2);
      width: 100%;
      text-align: center;
    }
    .avatar {
      width: 100px;
      height: 100px;
      background: url('https://cdn-icons-png.flaticon.com/512/1995/1995522.png') no-repeat center;
      background-size: cover;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .streak-meter {
      margin-top: 2rem;
      position: relative;
    }

    /* 🔥 Green Fire Effect */
    .green-fire {
      position: relative;
      width: 100%;
      height: 60px;
      background: radial-gradient(circle at center, #b6f7c1 0%, transparent 70%);
      border-radius: 30px;
      overflow: hidden;
    }

    .green-fire::before, .green-fire::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: radial-gradient(circle at center, rgba(0, 255, 0, 0.6) 0%, transparent 80%);
      animation: greenFlame 2s infinite ease-in-out;
      z-index: 1;
    }

    .green-fire::after {
      background: radial-gradient(circle at center, rgba(50, 255, 100, 0.4) 0%, transparent 80%);
      animation-delay: 1s;
    }

    @keyframes greenFlame {
      0% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
      50% {
        transform: scale(1.2) translateY(-10px);
        opacity: 0.7;
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .potato {
      margin-top: 1rem;
      height: 60px;
      animation: bounce 1.2s infinite cubic-bezier(.28,.84,.42,1);
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0);}
      20% { transform: translateY(-30px);}
      40% { transform: translateY(-50px);}
      60% { transform: translateY(-30px);}
      80% { transform: translateY(-10px);}
    }

    .info {
      margin-top: 2rem;
      text-align: left;
    }

    .badge {
      background-color: #d4edda;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      margin-right: 0.5rem;
      font-weight: bold;
      display: inline-block;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <div class="profile-card">
      <div class="avatar"></div>
      <h2>Welcome back, Farmer!! 🌾</h2>
      <div class="streak-meter">
        <div class="green-fire"></div>
        <img class="potato" src="https://cdn-icons-png.flaticon.com/512/590/590685.png" alt="Bouncing Potato">
        <p><strong>GreenGrow Streak:</strong> 7 Days 🔥</p>
      </div>
      <div class="info">
        <p><strong>Last Activity:</strong> Verified a pesticide QR in Kiambu County</p>
        <p><strong>Top Crops:</strong> Maize, Tomatoes, Beans</p>
        <p><strong>Achievements:</strong></p>
        <span class="badge">🌟 Consistent Farmer</span>
        <span class="badge">🔍 AgriTruth Seeker</span>
        <span class="badge">🎓 Knowledge Sprouter</span>
      </div>
    </div>
  </div>
        <div class="text-center mt-5">
        <a
          href="/"
          class="btn btn-success btn-lg px-5 py-2 shadow-lg rounded-pill animate_animated animate_fadeInUp"
          style="font-size: 1.2rem; font-weight: 600; text-transform: uppercase;"
        >
          ← Back to Home
        </a>
    </div>
    
    <footer class="text-center py-4 mt-5" style="background-color: #e8f5e9; color: #2e7d32; font-size: 0.9rem; font-weight: 500;">
        &copy; 2025 <strong>AgriTrue</strong>. Empowering informed agriculture 🌱
    </footer>
</body>
</html>
