<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - AgriTrue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7f5;
            font-family: 'Segoe UI', sans-serif;
        }
        .donate-card {
            max-width: 600px;
            margin: auto;
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.08);
            border-left: 6px solid #2d6a4f;
        }
        h2 {
            color: #2d6a4f;
            font-weight: bold;
        }
        .donate-info {
            background: #e9f7ef;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #2d6a4f;
        }
        .number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1b4332;
        }
    </style>
</head>

<body>
    <div class="container mt-5">

        <div class="donate-card">
            <h2 class="text-center mb-3">Support AgriTrue</h2>
            <p class="text-center text-muted">Your contribution helps us continue providing agricultural intelligence to farmers and communities.</p>

            <div class="mt-4 donate-info">
                <p class="mb-1"><strong>Paybill / Business Number:</strong></p>
                <p class="number">400200</p>

                <hr>

                <p class="mb-1"><strong>Account Number:</strong></p>
                <p class="number">01100929201001</p>

                <hr>

                <p class="mb-1"><strong>M-Pesa Mobile Number:</strong></p>
                <p class="number">0715 142 906</p>
            </div>

            <p class="text-center mt-4 text-secondary">
                Thank you for supporting AgriTrue 💚
            </p>

            <div class="text-center mt-3">
                <a href="/" class="btn btn-dark">Go Back Home</a>
            </div>
        </div>

    </div>
</body>
</html>
