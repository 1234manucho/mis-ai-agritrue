<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriTrue USSD Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-xl rounded-lg p-8 max-w-md w-full">
        <h2 class="text-2xl font-bold text-green-700 mb-4 text-center">📱 AgriTrue USSD Simulator</h2>
        <form method="POST" class="space-y-4">
            <input 
                type="text" 
                name="ussd_code" 
                placeholder="Enter USSD Code (e.g. *456# or option)" 
                required
                class="w-full border border-green-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
            >
            <input type="hidden" name="session_level" value="{{ session_level }}">
            <input type="hidden" name="selected_language" value="{{ selected_language }}">
            <button 
                type="submit" 
                class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition"
            >
                Submit
            </button>
        </form>

        {% if response %}
            <div class="mt-6 p-4 bg-green-100 border border-green-400 rounded text-sm whitespace-pre-line">
                {{ response | safe }}
            </div>
        {% endif %}
    </div>
      <div class="text-center mt-5">
        <a
          href="/"
          class="btn btn-success btn-lg px-5 py-2 shadow-lg rounded-pill animate_animated animate_fadeInUp"
          style="font-size: 1.2rem; font-weight: 600; text-transform: uppercase;"
        >
          ← Back to Home
        </a>
    </div>
    
    <footer class="text-center py-4 mt-5" style="background-color: #e8f5e9; color: #2e7d32; font-size: 0.9rem; font-weight: 500;">
        &copy; 2025 <strong>AgriTrue</strong>. Empowering informed agriculture 🌱
    </footer>
</body>

</html>
